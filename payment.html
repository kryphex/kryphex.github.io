<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Secure Payment</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body class="elite-ui page-payment">

<header>
<h1>
  <a href="index.html" style="display:flex; align-items:center;">
    <img src="logo.svg" alt="Kryphex Logo" style="height:28px;">
  </a>
</h1>
  <div id="authArea" class="header-auth"></div>
</header>

<section class="hero">
  <h2>Secure Consultation Payment</h2>
  <p>
    Complete your payment securely to proceed with scheduling your consultation.
  </p>
</section>

<section>
  <div class="container" style="text-align:center;">

    <div class="card">
      <h3>Enterprise Security Consultation</h3>
      <p style="font-size:18px; font-weight:600;">Rs 2,999</p>

      <button class="btn" onclick="openPaymentLink()">
        Pay Securely
      </button>

      <p style="margin-top:20px; font-size:13px; color:#666;">
        Payments are securely processed via Razorpay.
        International cards are supported.
      </p>
    </div>

  </div>
</section>

<script>
function openPaymentLink() {
  const paymentLink = "https://razorpay.com/payment-gateway/";
  window.open(paymentLink, "_blank", "noopener");
}
</script>

<footer>
  <div class="footer-bottom">
    © 2026 Kryphex. Enterprise Cybersecurity Solutions.
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
</body>
</html>
