<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Security Tools</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>
  <a href="index.html" style="display:flex; align-items:center;">
    <img src="logo.svg" alt="Kryphex Logo" style="height:28px;">
  </a>
</h1>
</header>

<section class="hero">
  <h2>Security Tools</h2>
  <p>Lightweight cybersecurity utilities built for awareness and risk assessment.</p>
</section>

<section>
  <div class="container">
    <div class="card">
      <h3>Password Strength Analyzer</h3>
      <input type="password" id="passwordInput" placeholder="Enter password">
      <p id="strengthResult"></p>
    </div>
  </div>
</section>

<script>
document.getElementById("passwordInput").addEventListener("input", function() {
  const value = this.value;
  let score = 0;

  if (value.length > 8) score++;
  if (/[A-Z]/.test(value)) score++;
  if (/[0-9]/.test(value)) score++;
  if (/[^A-Za-z0-9]/.test(value)) score++;

  const levels = ["Weak", "Moderate", "Strong", "Very Strong"];
  document.getElementById("strengthResult").innerText =
    value.length === 0 ? "" : "Strength: " + levels[score - 1];
});
</script>

</body>
</html>
