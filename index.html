<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Enterprise Cybersecurity</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2563eb;
      --dark: #0f172a;
      --muted: #64748b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: var(--dark);
    }

    /* ===== HEADER ===== */

    .header {
      position: fixed;
      top: 0;
      width: 100%;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 60px;
      backdrop-filter: blur(20px);
      background: rgba(255,255,255,0.85);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      z-index: 1000;
    }

    .logo {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 1px;
    }

    .nav {
      display: flex;
      gap: 40px;
      align-items: center;
    }

    .nav a {
      text-decoration: none;
      color: var(--dark);
      font-weight: 500;
      transition: 0.2s ease;
    }

    .nav a:hover {
      color: var(--primary);
    }

    .auth {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .login {
      text-decoration: none;
      font-weight: 600;
      color: var(--dark);
    }

    .signup {
      background: var(--primary);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .signup:hover {
      background: #1e40af;
    }

    /* ===== HERO ===== */

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 80px;
      background: radial-gradient(circle at 20% 20%, rgba(37,99,235,0.15), transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(37,99,235,0.1), transparent 40%);
    }

    .hero h1 {
      font-size: 64px;
      max-width: 900px;
      line-height: 1.1;
      margin: 0;
    }

    .hero p {
      margin-top: 30px;
      font-size: 20px;
      color: var(--muted);
      max-width: 600px;
    }

    .cta {
      margin-top: 40px;
      display: flex;
      gap: 20px;
    }

    .btn-primary {
      padding: 16px 34px;
      background: var(--primary);
      border-radius: 10px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s ease;
      box-shadow: 0 15px 30px rgba(37,99,235,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-4px);
    }

    .btn-secondary {
      padding: 16px 34px;
      border-radius: 10px;
      border: 1px solid #ddd;
      text-decoration: none;
      font-weight: 600;
      color: var(--dark);
    }

    /* ===== MOBILE ===== */

    @media (max-width: 900px) {

      .header {
        padding: 0 25px;
      }

      .nav {
        display: none;
      }

      .hero {
        padding: 0 25px;
      }

      .hero h1 {
        font-size: 38px;
      }

      .hero p {
        font-size: 16px;
      }

    }

  </style>
</head>

<body>

<header class="header">
  <div class="logo">KRYPHEX</div>

  <div class="nav">
    <a href="#">Platform</a>
    <a href="#">Security</a>
    <a href="#">Resources</a>
    <a href="#">Pricing</a>
  </div>

  <div class="auth">
    <a href="auth/login.html" class="login">Login</a>
    <a href="auth/signup.html" class="signup">Sign Up</a>
  </div>
</header>

<section class="hero">
  <h1>Enterprise-Grade Cybersecurity Infrastructure.</h1>
  <p>
    Threat intelligence, penetration testing, and zero-trust architecture
    built for high-growth organizations.
  </p>

  <div class="cta">
    <a href="consultation.html" class="btn-primary">Request Consultation</a>
    <a href="home.html" class="btn-secondary">Enter Platform</a>
  </div>
</section>

</body>
</html>
