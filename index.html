<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Enterprise Cybersecurity</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2563eb;
      --dark: #0f172a;
      --muted: #64748b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: var(--dark);
    }

    /* ===== HEADER ===== */

    .header {
      position: fixed;
      top: 0;
      width: 100%;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 60px;
      backdrop-filter: blur(20px);
      background: rgba(255,255,255,0.85);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      z-index: 1000;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .nav {
      display: flex;
      gap: 40px;
      align-items: center;
    }

    .nav a {
      text-decoration: none;
      color: var(--dark);
      font-weight: 500;
      transition: 0.2s ease;
    }

    .nav a:hover {
      color: var(--primary);
    }

    .auth {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .login {
      text-decoration: none;
      font-weight: 600;
      color: var(--dark);
    }

    .signup {
      background: var(--primary);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .signup:hover {
      background: #1e40af;
    }

    .auth-profile-menu {
      position: relative;
    }

    .auth-profile-trigger {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #dbe6f5;
      background: #f8fbff;
      color: var(--dark);
      border-radius: 12px;
      padding: 6px 10px;
      cursor: pointer;
      font-family: inherit;
    }

    .auth-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      background: #2563eb;
      color: #fff;
    }

    .auth-avatar.large {
      width: 42px;
      height: 42px;
      font-size: 14px;
    }

    .auth-identity {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.2;
    }

    .auth-identity strong {
      font-size: 13px;
    }

    .auth-identity small {
      font-size: 11px;
      color: var(--muted);
    }

    .auth-dropdown {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: min(90vw, 340px);
      background: #fff;
      border: 1px solid #dbe6f5;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18);
      padding: 12px;
      z-index: 2100;
      display: none;
    }

    .auth-dropdown.open {
      display: block;
    }

    .auth-dropdown-head {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e6edf8;
    }

    .auth-name {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      color: #0b2a66;
    }

    .auth-sub {
      margin: 3px 0 0;
      font-size: 12px;
      color: #64748b;
      color: #64748b;
    }

    .auth-action {
      width: 100%;
      display: block;
      text-align: left;
      text-decoration: none;
      border: 1px solid #dbe6f5;
      background: #f8fbff;
      color: #0b2a66;
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .auth-action.danger {
      color: #b91c1c;
      border-color: #f3d1d1;
      background: #fff6f6;
    }

    /* ===== HERO ===== */

    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 80px;
      background: radial-gradient(circle at 20% 20%, rgba(37,99,235,0.15), transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(37,99,235,0.1), transparent 40%);
    }

    .hero h1 {
      font-size: 64px;
      max-width: 900px;
      line-height: 1.1;
      margin: 0;
    }

    .hero p {
      margin-top: 30px;
      font-size: 20px;
      color: var(--muted);
      max-width: 600px;
    }

    .cta {
      margin-top: 40px;
      display: flex;
      gap: 20px;
    }

    .btn-primary {
      padding: 16px 34px;
      background: var(--primary);
      border-radius: 10px;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s ease;
      box-shadow: 0 15px 30px rgba(37,99,235,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-4px);
    }

    .btn-secondary {
      padding: 16px 34px;
      border-radius: 10px;
      border: 1px solid #ddd;
      text-decoration: none;
      font-weight: 600;
      color: var(--dark);
    }

    /* ===== MOBILE ===== */

    @media (max-width: 900px) {

      .header {
        padding: 0 25px;
      }

      .nav {
        display: none;
      }

      .hero {
        padding: 0 25px;
      }

      .hero h1 {
        font-size: 38px;
      }

      .hero p {
        font-size: 16px;
      }

      .auth-identity {
        display: none;
      }

    }

  </style>
</head>

<body>

<header class="header">
  <div class="logo">
    <a href="index.html" style="display:flex; align-items:center;">
      <img src="logo.svg" alt="Kryphex Logo" style="height:28px;">
    </a>
  </div>

  <div class="nav">
    <a href="platform.html" data-protected-href="platform.html" class="protected-nav-link">Platform</a>
    <a href="security.html" data-protected-href="security.html" class="protected-nav-link">Security</a>
    <a href="resources.html" data-protected-href="resources.html" class="protected-nav-link">Resources</a>
    <a href="pricing.html" data-protected-href="pricing.html" class="protected-nav-link">Pricing</a>
  </div>

  <div class="auth" id="authActions">
    <a href="auth/login.html" class="login">Login</a>
    <a href="auth/signup.html" class="signup">Sign Up</a>
  </div>
</header>


<section class="hero">
  <h1>Enterprise-Grade Cybersecurity Infrastructure.</h1>
  <p>
    Threat intelligence, penetration testing, and zero-trust architecture
    built for high-growth organizations.
  </p>

  <div class="cta">
    <a href="consultation.html" class="btn-primary" id="requestConsultationBtn">Request Consultation</a>
    <a href="auth/login.html" class="btn-secondary" id="enterPlatformBtn">Enter Platform</a>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const indexSupabase = supabase.createClient(
  "https://xvtnnszvfbirixppbdtl.supabase.co",
  "sb_publishable_pQJ3E0t7j34sImItSqxn6Q_jLBGuasq"
);

async function syncIndexAuthUI() {
  const authActions = document.getElementById("authActions");
  const enterPlatformBtn = document.getElementById("enterPlatformBtn");
  const requestConsultationBtn = document.getElementById("requestConsultationBtn");
  const protectedNavLinks = document.querySelectorAll(".protected-nav-link");
  const { data } = await indexSupabase.auth.getUser();
  const isLoggedIn = Boolean(data && data.user);

  if (isLoggedIn) {
    const storageKey = `kryphex_profile_${data.user.id}`;
    let localProfile = {};
    try {
      const raw = localStorage.getItem(storageKey);
      localProfile = raw ? JSON.parse(raw) : {};
    } catch {
      localProfile = {};
    }

    const remoteMeta = data.user.user_metadata || {};
    const displayName = (remoteMeta.name || localProfile.name || data.user.email || "User").trim();
    const baseRole = (remoteMeta.role || localProfile.role || "Security Member").trim();
    const displayCompany = (remoteMeta.company || localProfile.company || "Kryphex").trim();
    const initials = (displayName.match(/\b\w/g) || [])
      .slice(0, 2)
      .join("")
      .toUpperCase() || "U";

    let isAdmin = false;
    const { data: profile } = await indexSupabase
      .from("profiles")
      .select("role")
      .eq("id", data.user.id)
      .maybeSingle();

    if (profile && profile.role === "admin") {
      isAdmin = true;
    }
    const displayRole = isAdmin ? "Founder/C.E.O" : baseRole;

    authActions.innerHTML = `
      <div class="auth-profile-menu" id="authProfileMenu">
        <button class="auth-profile-trigger" id="authProfileTrigger" type="button" aria-label="Open profile menu" aria-expanded="false">
          <span class="auth-avatar">${initials}</span>
          <span class="auth-identity">
            <strong>${displayName}</strong>
            <small>${displayCompany}</small>
          </span>
        </button>
        <div class="auth-dropdown" id="authDropdown">
          <div class="auth-dropdown-head">
            <div class="auth-avatar large">${initials}</div>
            <div>
              <p class="auth-name">${displayName}</p>
              <p class="auth-sub">${displayRole} | ${displayCompany}</p>
            </div>
          </div>
          <a href="profile.html" class="auth-action">View Profile</a>
          ${isAdmin ? '<a href="tools/console.html" class="auth-action">Console</a>' : ""}
          <button class="auth-action danger" id="logoutBtn" type="button">Log Out</button>
        </div>
      </div>
    `;

    const profileMenu = document.getElementById("authProfileMenu");
    const profileTrigger = document.getElementById("authProfileTrigger");
    const authDropdown = document.getElementById("authDropdown");
    if (profileTrigger && authDropdown) {
      profileTrigger.addEventListener("click", (event) => {
        event.stopPropagation();
        const isOpen = authDropdown.classList.toggle("open");
        profileTrigger.setAttribute("aria-expanded", String(isOpen));
      });
      document.addEventListener("click", (event) => {
        if (!profileMenu || profileMenu.contains(event.target)) return;
        authDropdown.classList.remove("open");
        profileTrigger.setAttribute("aria-expanded", "false");
      });
    }
    enterPlatformBtn.href = "home.html";
    requestConsultationBtn.href = "consultation.html";

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await indexSupabase.auth.signOut();
      location.reload();
    });

    protectedNavLinks.forEach((link) => {
      link.href = link.dataset.protectedHref;
    });
    return;
  }

  authActions.innerHTML = `
    <a href="auth/login.html" class="login">Login</a>
    <a href="auth/signup.html" class="signup">Sign Up</a>
  `;
  enterPlatformBtn.href = "auth/login.html";
  requestConsultationBtn.href = "auth/login.html?redirect=consultation.html";
  protectedNavLinks.forEach((link) => {
    link.href = `auth/login.html?redirect=${encodeURIComponent(link.dataset.protectedHref)}`;
  });
}

syncIndexAuthUI();
</script>

</body>
</html>
