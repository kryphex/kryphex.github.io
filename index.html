<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Enterprise Cybersecurity</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #ffffff;
    }

    /* ===== HEADER ===== */

    .elite-header {
      position: fixed;
      top: 0;
      width: 100%;
      height: 80px;
      backdrop-filter: blur(16px);
      background: rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      z-index: 1000;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .logo {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 1px;
      color: #0a1f44;
    }

    .nav-links {
      display: flex;
      gap: 30px;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: #111;
      font-weight: 500;
    }

    .auth-buttons {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .login-link {
      text-decoration: none;
      font-weight: 600;
      color: #0a1f44;
    }

    .signup-btn {
      background: #0056ff;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .signup-btn:hover {
      background: #003bb5;
    }

    /* ===== HERO ===== */

    .elite-hero {
      height: 100vh;
      background: linear-gradient(135deg,#0a1f44,#003366);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
      text-align: center;
    }

    .elite-hero h1 {
      font-size: 56px;
      max-width: 900px;
    }

    .elite-hero p {
      margin-top: 25px;
      font-size: 20px;
      max-width: 700px;
      opacity: 0.9;
    }

    .cta-btn {
      margin-top: 40px;
      padding: 16px 42px;
      background: linear-gradient(135deg,#0056ff,#003bb5);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 15px 35px rgba(0,86,255,0.4);
      transition: 0.3s ease;
    }

    .cta-btn:hover {
      transform: translateY(-4px);
    }

    /* ===== MOBILE ===== */

    @media (max-width: 900px) {

      .nav-links {
        display: none;
      }

      .elite-hero h1 {
        font-size: 34px;
      }

      .elite-hero p {
        font-size: 16px;
      }
    }

  </style>
</head>

<body>

<header class="elite-header">
  <div class="logo">KRYPHEX</div>

  <div class="nav-links">
    <a href="#">Services</a>
    <a href="#">Insights</a>
    <a href="#">About</a>
  </div>

  <div class="auth-buttons">
    <a href="auth/login.html" class="login-link">Login</a>
    <a href="auth/signup.html" class="signup-btn">Sign Up</a>
  </div>
</header>

<section class="elite-hero">
  <h1>Enterprise Cybersecurity Architecture.</h1>
  <p>
    Structured penetration testing, threat intelligence modeling,
    and zero-trust infrastructure for organizations operating at scale.
  </p>

  <button class="cta-btn" onclick="location.href='consultation.html'">
    Request Consultation
  </button>
</section>

</body>
</html>
