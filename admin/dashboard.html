<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Admin Dashboard</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://xvtnnszvfbirixppbdtl.supabase.co",
  "sb_publishable_pQJ3E0t7j34sImItSqxn6Q_jLBGuasq"
);

async function loadAdminData() {
  const { data: userData } = await supabaseClient.auth.getUser();
  const user = userData.user;

  if (!user) {
    window.location.href = "../auth/login.html";
    return;
  }

  // Check role
  const { data: profile } = await supabaseClient
    .from("profiles")
    .select("role")
    .eq("id", user.id)
    .single();

  if (profile.role !== "admin") {
    document.body.innerHTML =
      "<h2 style='text-align:center;margin-top:100px;'>Access Denied</h2>";
    return;
  }

  // Load all consultations
  const { data } = await supabaseClient
    .from("consultations")
    .select("*")
    .order("created_at", { ascending: false });

  const container = document.getElementById("adminContainer");

  if (!data || data.length === 0) {
    container.innerHTML = "<p>No consultation requests yet.</p>";
    return;
  }

  data.forEach(item => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <strong>User ID:</strong> ${item.user_id}<br>
      <strong>Name:</strong> ${item.full_name}<br>
      <strong>Company:</strong> ${item.company}<br>
      <strong>Service:</strong> ${item.service}<br>
      <strong>Date:</strong> ${new Date(item.created_at).toLocaleString()}<br><br>
      ${item.message}
    `;
    container.appendChild(div);
  });
}

loadAdminData();
</script>

<section class="hero">
  <h2>Admin Dashboard</h2>
</section>

<section>
  <div class="container" id="adminContainer"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

</body>
</html>
