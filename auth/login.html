<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Login</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #e6ecff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .auth-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 24px;
      z-index: 100;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .auth-box {
      width: 100%;
      max-width: 420px;
      padding: 45px;
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    input:focus {
      border-color: #0056ff;
      outline: none;
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      background: #000;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .divider {
      margin: 20px 0;
      font-size: 12px;
      color: #777;
    }

    .oauth-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .secondary {
      margin-top: 20px;
      font-size: 13px;
    }

    .secondary a {
      color: #0056ff;
      text-decoration: none;
      font-weight: 500;
    }

    .error {
      margin-top: 10px;
      color: red;
      font-size: 13px;
    }
  </style>
</head>

<body>
<header class="auth-header">
  <a href="../index.html" style="display:flex; align-items:center;">
    <img src="../logo.svg" alt="Kryphex Logo" style="height:28px;">
  </a>
</header>

<div class="auth-box">

  <!-- LOGO REMOVED ONLY -->

  <h1>Log In to Kryphex</h1>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button class="primary-btn" id="loginBtn">Login</button>

  <div class="secondary">
    <a href="javascript:void(0)" onclick="resetPassword()">Forgot password?</a>
  </div>

  <button class="oauth-btn" onclick="magicLogin()">
    Send Magic Link
  </button>

  <div class="divider">or continue with</div>

  <button class="oauth-btn" onclick="googleLogin()">
    Continue with Google
  </button>

  <div class="secondary">
    Don't have an account?
    <a href="signup.html">Create account</a>
  </div>

  <div id="errorMsg" class="error"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://xvtnnszvfbirixppbdtl.supabase.co",
  "sb_publishable_pQJ3E0t7j34sImItSqxn6Q_jLBGuasq"
);

// Force fresh login every time this page is opened.
supabaseClient.auth.signOut();

const redirectTarget = (() => {
  const param = new URLSearchParams(window.location.search).get("redirect");
  if (!param) return "../home.html";
  if (!/^[a-zA-Z0-9_./-]+$/.test(param)) return "../home.html";
  if (param.startsWith("http")) return "../home.html";
  return `../${param.replace(/^\/+/, "")}`;
})();

document.getElementById("loginBtn").addEventListener("click", async () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    document.getElementById("errorMsg").innerText = error.message;
  } else {
    window.location.href = redirectTarget;
  }
});

document.getElementById("password").addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    document.getElementById("loginBtn").click();
  }
});

async function resetPassword() {
  const email = document.getElementById("email").value.trim();
  if (!email) {
    document.getElementById("errorMsg").innerText = "Enter your email first.";
    return;
  }

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: `${window.location.origin}/auth/login.html`
  });

  document.getElementById("errorMsg").innerText =
    error ? error.message : "Password reset link sent to your email.";
}

async function magicLogin() {
  const email = document.getElementById("email").value.trim();
  if (!email) {
    document.getElementById("errorMsg").innerText = "Enter your email first.";
    return;
  }

  const { error } = await supabaseClient.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: `${window.location.origin}/home.html` }
  });

  document.getElementById("errorMsg").innerText =
    error ? error.message : "Magic link sent. Check your inbox.";
}

async function googleLogin() {
  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: `${window.location.origin}/home.html` }
  });

  if (error) {
    document.getElementById("errorMsg").innerText = error.message;
  }
}
</script>

</body>
</html>
