<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Login</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../auth.css"> <!-- your CSS file -->
</head>

<body>

<div class="auth-box">

  <h1>Log in to Kryphex</h1>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button class="primary-btn" id="loginBtn">Sign In</button>

  <div class="secondary">
    <a href="#" onclick="resetPassword()">Forgot your password?</a>
  </div>

  <div class="divider">OR</div>

  <button class="google-btn" onclick="googleLogin()">
    Continue with Google
  </button>

  <div class="secondary">
    Don’t have an account?
    <a href="signup.html">Sign up</a>
  </div>

  <div id="errorMsg" class="error"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://xvtnnszvfbirixppbdtl.supabase.co",
  "sb_publishable_pQJ3E0t7j34sImItSqxn6Q_jLBGuasq"
);

supabaseClient.auth.getUser().then(({ data }) => {
  if (data.user) {
    window.location.href = "../home.html";
  }
});

document.getElementById("loginBtn").addEventListener("click", async () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    document.getElementById("errorMsg").innerText = error.message;
  } else {
    window.location.href = "../home.html";
  }
});

async function googleLogin() {
  await supabaseClient.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: "https://kryphex.github.io/home.html"
    }
  });
}

async function resetPassword() {
  const email = document.getElementById("email").value;

  if (!email) {
    alert("Enter your email first.");
    return;
  }

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: "https://kryphex.github.io/auth/reset.html"
  });

  if (error) alert(error.message);
  else alert("Password reset email sent.");
}
</script>

</body>
</html>
