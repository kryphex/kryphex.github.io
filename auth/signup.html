<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Create Account</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #e6ecff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .bg-blob {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,86,255,0.2), transparent 60%);
      bottom: -200px;
      left: -200px;
      animation: float 8s infinite alternate ease-in-out;
    }

    @keyframes float {
      from { transform: translateY(0px); }
      to { transform: translateY(40px); }
    }

    .auth-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 45px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.1);
      text-align: center;
      z-index: 2;
    }

    /* 🔥 LOGO STYLE REMOVED */

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    input:focus {
      border-color: #0056ff;
      outline: none;
    }

    .primary-btn {
      width: 100%;
      padding: 14px;
      background: #000;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .divider {
      margin: 20px 0;
      font-size: 12px;
      color: #777;
    }

    .google-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #e0e0e0;
      background: #ffffff;
      font-size: 15px;
      font-weight: 600;
      color: #1f1f1f;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .google-btn:hover {
      background: #f9f9f9;
      border-color: #d0d0d0;
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.06);
    }

    .secondary {
      margin-top: 20px;
      font-size: 13px;
    }

    .secondary a {
      color: #0056ff;
      text-decoration: none;
      font-weight: 500;
    }

    .error {
      margin-top: 10px;
      color: red;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="bg-blob"></div>

<div class="auth-container">

  <!-- 🔥 LOGO BLOCK REMOVED -->

  <h1>Create your Kryphex account</h1>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <div id="strengthText" style="font-size:12px;margin-bottom:15px;"></div>

  <button class="primary-btn" id="signupBtn">Create Account</button>

  <div class="divider">or continue with</div>

  <button class="google-btn" onclick="oauthLogin('google')">
    Continue with Google
  </button>

  <div class="secondary">
    Already have an account?
    <a href="login.html">LogIn</a>
  </div>

  <div id="errorMsg" class="error"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://xvtnnszvfbirixppbdtl.supabase.co",
  "sb_publishable_pQJ3E0t7j34sImItSqxn6Q_jLBGuasq"
);

const passwordInput = document.getElementById("password");
const strengthText = document.getElementById("strengthText");

passwordInput.addEventListener("input", function() {
  const val = passwordInput.value;

  if (val.length < 6) {
    strengthText.innerText = "Weak";
    strengthText.style.color = "red";
  } else if (val.match(/[A-Z]/) && val.match(/[0-9]/)) {
    strengthText.innerText = "Strong";
    strengthText.style.color = "green";
  } else {
    strengthText.innerText = "Medium";
    strengthText.style.color = "orange";
  }
});

document.getElementById("signupBtn").addEventListener("click", async () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signUp({
    email,
    password
  });

  if (error) {
    document.getElementById("errorMsg").innerText = error.message;
  } else {
    alert("Check your email to confirm your account.");
  }
});

async function oauthLogin(provider) {
  if (provider !== "google") return;

  await supabaseClient.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: "https://kryphex.github.io/home.html"
    }
  });
}
</script>

</body>
</html>
