<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Create Account</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../auth.css">
</head>

<body>

<div class="auth-container">

  <h1>Create your Kryphex account</h1>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <div id="strengthText"></div>

  <button class="primary-btn" id="signupBtn">
    Create Account
  </button>

  <div class="divider">OR</div>

  <button class="google-btn" onclick="googleLogin()">
    Continue with Google
  </button>

  <div class="secondary">
    Already have an account?
    <a href="login.html">Sign in</a>
  </div>

  <div id="errorMsg" class="error"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://xvtnnszvfbirixppbdtl.supabase.co",
  "sb_publishable_pQJ3E0t7j34sImItSqxn6Q_jLBGuasq"
);

// Password strength
const passwordInput = document.getElementById("password");
const strengthText = document.getElementById("strengthText");

passwordInput.addEventListener("input", function() {
  const val = passwordInput.value;

  if (val.length < 6) {
    strengthText.innerText = "Weak";
    strengthText.style.color = "red";
  } else if (val.match(/[A-Z]/) && val.match(/[0-9]/)) {
    strengthText.innerText = "Strong";
    strengthText.style.color = "green";
  } else {
    strengthText.innerText = "Medium";
    strengthText.style.color = "orange";
  }
});

document.getElementById("signupBtn").addEventListener("click", async () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signUp({
    email,
    password
  });

  if (error) {
    document.getElementById("errorMsg").innerText = error.message;
  } else {
    alert("Check your email to confirm your account.");
  }
});

async function googleLogin() {
  await supabaseClient.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: "https://kryphex.github.io/home.html"
    }
  });
}
</script>

</body>
</html>
