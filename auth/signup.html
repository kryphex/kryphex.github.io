<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://xvtnnszvfbirixppbdtl.supabase.co",
  "sb_publishable_pQJ3E0t7j34sImItSqxn6Q_jLBGuasq"
);

async function signup() {
  const email = document.getElementById("signupEmail").value;
  const password = document.getElementById("signupPassword").value;

  const { error } = await supabaseClient.auth.signUp({
    email,
    password,
    options: {
      emailRedirectTo: "https://kryphex.github.io/auth/login.html"
    }
  });

  if (error) {
    document.getElementById("signupMessage").innerText = error.message;
  } else {
    document.getElementById("signupMessage").innerText =
      "Check your email to confirm.";
  }
}
</script>
