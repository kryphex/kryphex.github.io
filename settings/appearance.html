<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Settings | Appearance</title><link rel="stylesheet" href="common.css"></head>
<body>
<main class="shell">
<aside class="side"><div class="acct"><div id="settingsAvatar" class="av">U</div><div><strong id="settingsName">User</strong><span>Personal account</span></div></div><div class="grp"><div class="gtitle">Settings</div><a class="nav" href="account.html">Account</a><a class="nav active" href="appearance.html">Appearance</a><a class="nav" href="accessibility.html">Accessibility</a><a class="nav" href="notifications.html">Notifications</a><a class="nav" href="security.html">Security</a><a class="nav" href="sessions.html">Sessions</a><a class="nav" href="privacy.html">Data & Privacy</a><a class="nav" href="danger.html">Danger Zone</a></div></aside>
<section class="main"><div class="main-top"><h1>Appearance</h1><a class="btn" href="account.html">Back</a></div><div class="page"><h2>Theme and Layout</h2><p class="hint">Visual preferences.</p><div class="row"><label for="themePreference">Theme</label><select id="themePreference"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="row"><label for="uiDensity">UI Density</label><select id="uiDensity"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select></div><div class="row"><label for="fontScale">Font Scale</label><select id="fontScale"><option value="default">Default</option><option value="large">Large</option><option value="x-large">Extra Large</option></select></div><div class="row"><label for="defaultLanding">Default Landing</label><select id="defaultLanding"><option value="home">Home</option><option value="services">Services</option><option value="tools">Tools</option><option value="consultation">Consultation</option></select></div><div class="actions"><button id="saveBtn" class="btn primary" type="button">Save Appearance</button></div><p id="status" class="status"></p></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/auth.js"></script><script src="common.js"></script>
<script>document.addEventListener('DOMContentLoaded',async()=>{const u=await requireSettingsUser();if(!u)return;const k=settingsKey(u.id);const s=JSON.parse(localStorage.getItem(k)||'{}');themePreference.value=s.themePreference||'system';uiDensity.value=s.uiDensity||'comfortable';fontScale.value=s.fontScale||'default';defaultLanding.value=s.defaultLanding||'home';saveBtn.onclick=()=>{localStorage.setItem(k,JSON.stringify({...s,themePreference:themePreference.value,uiDensity:uiDensity.value,fontScale:fontScale.value,defaultLanding:defaultLanding.value}));applyStoredUserSettings(u);setSettingsStatus('Appearance saved.');};});</script>
</body></html>
