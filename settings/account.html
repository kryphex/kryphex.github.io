<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Settings | Account</title><link rel="stylesheet" href="common.css"></head>
<body>
<main class="shell">
<aside class="side"><div class="acct"><div id="settingsAvatar" class="av">U</div><div><strong id="settingsName">User</strong><span>Personal account</span></div></div><div class="grp"><div class="gtitle">Settings</div><a class="nav active" href="account.html">Account</a><a class="nav" href="appearance.html">Appearance</a><a class="nav" href="accessibility.html">Accessibility</a><a class="nav" href="notifications.html">Notifications</a><a class="nav" href="security.html">Security</a><a class="nav" href="sessions.html">Sessions</a><a class="nav" href="privacy.html">Data & Privacy</a><a class="nav" href="danger.html">Danger Zone</a></div></aside>
<section class="main"><div class="main-top"><h1>Account</h1><a class="btn" href="../profile.html">Back</a></div><div class="page"><h2>Email and Locale</h2><p class="hint" id="accountEmail">-</p><div class="row"><label for="language">Language</label><select id="language"><option value="en">English</option><option value="hi">Hindi</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option></select></div><div class="row"><label for="timezone">Timezone</label><input id="timezone" type="text" placeholder="Asia/Calcutta"></div><div class="row"><label for="dateFormat">Date Format</label><select id="dateFormat"><option value="dd-mm-yyyy">DD-MM-YYYY</option><option value="mm-dd-yyyy">MM-DD-YYYY</option><option value="yyyy-mm-dd">YYYY-MM-DD</option></select></div><div class="row"><label for="timeFormat">Time Format</label><select id="timeFormat"><option value="12h">12 Hour</option><option value="24h">24 Hour</option></select></div><div class="actions"><button id="saveBtn" class="btn primary" type="button">Save Account</button></div><p id="status" class="status"></p></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/auth.js"></script><script src="common.js"></script>
<script>document.addEventListener('DOMContentLoaded',async()=>{const u=await requireSettingsUser();if(!u)return;accountEmail.textContent=u.email||'-';const k=settingsKey(u.id);const s=JSON.parse(localStorage.getItem(k)||'{}');language.value=s.language||'en';timezone.value=s.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone||'';dateFormat.value=s.dateFormat||'dd-mm-yyyy';timeFormat.value=s.timeFormat||'12h';saveBtn.onclick=()=>{localStorage.setItem(k,JSON.stringify({...s,language:language.value,timezone:timezone.value.trim(),dateFormat:dateFormat.value,timeFormat:timeFormat.value}));applyStoredUserSettings(u);setSettingsStatus('Account settings saved.');};});</script>
</body></html>
