<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Danger Zone</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <main class="shell">
    <aside class="side">
      <div class="acct">
        <div id="settingsAvatar" class="av">U</div>
        <div><strong id="settingsName">User</strong><span>Personal account</span></div>
      </div>
      <div class="grp">
        <div class="gtitle">Settings</div>
        
        <a class="nav" href="account.html">Account</a>
        <a class="nav" href="appearance.html">Appearance</a>
        <a class="nav" href="accessibility.html">Accessibility</a>
        <a class="nav" href="notifications.html">Notifications</a>
        <a class="nav" href="security.html">Security</a>
        <a class="nav" href="sessions.html">Sessions</a>
        <a class="nav" href="privacy.html">Data & Privacy</a>
        <a class="nav active" href="danger.html">Danger Zone</a>
      </div>
    </aside>

    <section class="main">
      <div class="main-top">
        <h1>Danger Zone</h1>
        <a class="btn" href="account.html">Back</a>
      </div>

      <div class="page">
        <h2>Delete Account Request</h2>
        <p class="hint">Submit a deletion request. This does not instantly delete the account.</p>

        <div class="row">
          <label for="deleteReason">Reason</label>
          <textarea id="deleteReason" placeholder="Tell us why you want account deletion."></textarea>
        </div>

        <div class="actions">
          <button id="deleteRequestBtn" class="btn danger" type="button">Submit Delete Request</button>
        </div>
        <p id="status" class="status"></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script src="common.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const user = await requireSettingsUser();
      if (!user) return;

      const deleteReason = document.getElementById("deleteReason");
      const deleteRequestBtn = document.getElementById("deleteRequestBtn");

      if (deleteRequestBtn) {
        deleteRequestBtn.addEventListener("click", async () => {
          const reason = (deleteReason && deleteReason.value ? deleteReason.value : "").trim();
          if (!reason) {
            setSettingsStatus("Please provide a reason before submitting.", true);
            return;
          }

          const request = {
            type: "delete_account",
            user_id: user.id,
            email: user.email,
            reason,
            status: "pending",
            created_at: new Date().toISOString()
          };

          let remoteSaved = false;
          try {
            const { error } = await supabaseClient.from("account_requests").insert(request);
            remoteSaved = !error;
          } catch {
            remoteSaved = false;
          }

          const queueKey = "kryphex_account_requests_queue";
          const queue = JSON.parse(localStorage.getItem(queueKey) || "[]");
          queue.push(request);
          localStorage.setItem(queueKey, JSON.stringify(queue));

          setSettingsStatus(remoteSaved ? "Delete request submitted." : "Delete request queued locally.", !remoteSaved);
        });
      }
    });
  </script>
</body>
</html>
