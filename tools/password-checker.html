<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Password Strength Analyzer</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
  <h1>Kryphex</h1>
</header>

<section class="hero">
  <h2>Password Strength Analyzer</h2>
</section>

<section>
  <div class="container">
    <div class="card">
      <input type="password" id="passwordInput" placeholder="Enter password">
      <p id="strengthResult"></p>
    </div>
  </div>
</section>

<script>
document.getElementById("passwordInput").addEventListener("input", function() {
  const value = this.value;
  let score = 0;
  if (value.length > 8) score++;
  if (/[A-Z]/.test(value)) score++;
  if (/[0-9]/.test(value)) score++;
  if (/[^A-Za-z0-9]/.test(value)) score++;
  const levels = ["Weak", "Moderate", "Strong", "Very Strong"];
  document.getElementById("strengthResult").innerText =
    value.length === 0 ? "" : "Strength: " + levels[Math.max(score - 1, 0)];
});
</script>

</body>
</html>
