<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Public IP Viewer</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
  <h1>
  <a href="../index.html" style="display:flex; align-items:center;">
    <img src="../logo.svg" alt="Kryphex Logo" style="height:28px;">
  </a>
</h1>  <div id="authArea" class="header-auth"></div>
</header>

<section class="hero">
  <h2>Public IP Viewer</h2>
</section>

<section>
  <div class="container">
    <div class="card">
      <button class="btn" onclick="getIP()">Check My Public IP</button>
      <p id="ipResult" style="margin-top:20px;"></p>
    </div>
  </div>
</section>

<script>
async function getIP() {
  const response = await fetch("https://api.ipify.org?format=json");
  const data = await response.json();
  document.getElementById("ipResult").innerText = data.ip;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/auth.js"></script>

</body>
</html>
