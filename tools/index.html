<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Security Toolkit</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<header>
  <h1>Kryphex</h1>
</header>

<section class="hero">

</section>

<section>
  <div class="container tools-grid">

    <div class="card">
      <h3>Password Strength Analyzer</h3>
      <button class="btn"
        onclick="location.href='password-checker.html'">
        Open Tool
      </button>
    </div>

    <div class="card">
      <h3>Secure Password Generator</h3>
      <button class="btn"
        onclick="location.href='password-generator.html'">

      </button>
    </div>

    <div class="card">
      <h3>Base64 Encoder / Decoder</h3>
      <button class="btn"
        onclick="location.href='base64-tool.html'">
        Open Tool
      </button>
    </div>

    <div class="card">
      <h3>SHA-256 Hash Generator</h3>
      <button class="btn"
        onclick="location.href='hash-generator.html'">
        Open Tool
      </button>
    </div>

    <div class="card">
      <h3>Public IP Viewer</h3>
      <button class="btn"
        onclick="location.href='ip-viewer.html'">

      </button>
    </div>
