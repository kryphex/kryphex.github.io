<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | SHA-256 Generator</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="elite-ui page-tools-hash-generator">

<header>
<h1>
  <a href="../index.html" style="display:flex; align-items:center;">
    <img src="../logo.svg" alt="Kryphex Logo" style="height:28px;">
  </a>
</h1>
  <div id="authArea" class="header-auth"></div>
</header>

<section class="hero">
  <h2>SHA-256 Hash Generator</h2>
</section>

<section>
  <div class="container">
    <div class="card">
      <input type="text" id="hashInput" placeholder="Enter text">
      <button class="btn" onclick="generateHash()" style="margin-top:15px;">
        Generate Hash
      </button>
      <p id="hashOutput" style="margin-top:20px;"></p>
    </div>
  </div>
</section>

<script>
async function generateHash() {
  const text = document.getElementById("hashInput").value;
  const buffer = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", buffer);
  const hashArray = Array.from(new Uint8Array(hash));
  const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  document.getElementById("hashOutput").innerText = hashHex;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/auth.js"></script>
</body>
</html>
