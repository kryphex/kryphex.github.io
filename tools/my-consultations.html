<!DOCTYPE html>
<html>
<head>
  <title>My Consultations | Kryphex</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<h2 style="text-align:center;margin-top:40px;">
My Consultation Requests
</h2>

<div class="container" id="list"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://xvtnnszvfbirixppbdtl.supabase.co",
  "sb_publishable_pQJ3E0t7j34sImItSqxn6Q_jLBGuasq"
);

async function loadConsultations() {

  const { data: userData } = await supabaseClient.auth.getUser();
  const user = userData.user;

  if (!user) {
    window.location.href = "../auth/login.html";
    return;
  }

  const { data, error } = await supabaseClient
    .from("consultations")
    .select("*")
    .eq("user_id", user.id)
    .order("created_at", { ascending: false });

  const container = document.getElementById("list");

  if (!data || data.length === 0) {
    container.innerHTML = "<p>No consultation requests yet.</p>";
    return;
  }

  container.innerHTML = "";

  data.forEach(item => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <strong>Service:</strong> ${item.service}<br>
      <strong>Status:</strong> ${item.status}<br>
      <strong>Date:</strong> ${new Date(item.created_at).toLocaleString()}<br><br>
      ${item.message}
    `;
    container.appendChild(div);
  });
}

loadConsultations();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/auth.js"></script>

</body>
</html>
