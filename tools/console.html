<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Security Console</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<!-- ================= HEADER ================= -->

<header>
  <h1 class="logo">
    <a href="../index.html">
      <img src="../logo.svg" alt="Kryphex Logo" style="height:28px;">
    </a>
  </h1>
</header>

<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://xvtnnszvfbirixppbdtl.supabase.co",
  "sb_publishable_pQJ3E0t7j34sImItSqxn6Q_jLBGuasq"
);

// Protect page
async function checkAuth() {
  const { data } = await supabaseClient.auth.getUser();
  if (!data.user) {
    window.location.href = "../auth/login.html";
  }
}
checkAuth();

// Load consultations
async function loadConsultations() {
  const { data: userData } = await supabaseClient.auth.getUser();
  const user = userData.user;
  if (!user) return;

  const { data, error } = await supabaseClient
    .from("consultations")
    .select("*")
    .order("created_at", { ascending: false });

  const container = document.getElementById("consultList");

  if (!data || data.length === 0) {
    container.innerHTML = "<p>No consultation requests yet.</p>";
    return;
  }

  container.innerHTML = "";

  data.forEach(item => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <strong>Service:</strong> ${item.service}<br>
      <strong>Status:</strong> ${item.status}<br>
      <strong>Date:</strong> ${new Date(item.created_at).toLocaleString()}<br><br>
      ${item.message}
    `;
    container.appendChild(div);
  });
}

document.addEventListener("DOMContentLoaded", loadConsultations);

// Logout
async function logout() {
  await supabaseClient.auth.signOut();
  window.location.href = "../index.html";
}
</script>

<!-- ================= DASHBOARD ================= -->

<div class="dashboard">

  <div class="sidebar">
    <h2>Kryphex Console</h2>
    <a href="#">Dashboard</a>
    <a href="../admin/dashboard.html">Admin Panel</a>
    <a href="#">Threat Feed</a>
    <a href="#">Monitoring</a>
    <a href="history.html">Scan History</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>

  <div class="dashboard-content">
    <h2>My Consultation Requests</h2>
    <div id="consultList"></div>

    <hr style="margin:40px 0;">

    <h2>Enterprise Security Console</h2>
    <p>System Status: Operational</p>
    <p>Threat Intelligence: Active</p>
    <p>Firewall Monitoring: Enabled</p>
  </div>

</div>

</body>
</html>
