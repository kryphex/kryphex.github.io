<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Password Generator</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<header><h1>Kryphex</h1></header>

<section class="hero">
  <h2>Secure Password Generator</h2>
</section>

<section>
  <div class="container">
    <div class="card">
      <button class="btn" onclick="generatePassword()">Generate Password</button>
      <p id="generatedPassword" style="margin-top:20px;"></p>
    </div>
  </div>
</section>

<script>
function generatePassword() {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
  let password = "";
  for (let i = 0; i < 16; i++) {
    password += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  document.getElementById("generatedPassword").innerText = password;
}
</script>

</body>
</html>
