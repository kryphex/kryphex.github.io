<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Password Generator</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<header><h1>
  <a href="../index.html" style="display:flex; align-items:center;">
    <img src="../logo.svg" alt="Kryphex Logo" style="height:28px;">
  </a>
</h1></header>

<section class="hero">
  <h2>Secure Password Generator</h2>
</section>

<section>
  <div class="container">
    <div class="card">
      <button class="btn" onclick="generatePassword()">Generate Password</button>
      <p id="generatedPassword" style="margin-top:20px;"></p>
    </div>
  </div>
</section>

<script>
function generatePassword() {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
  let password = "";
  for (let i = 0; i < 16; i++) {
    password += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  document.getElementById("generatedPassword").innerText = password;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>

</body>
</html>
