<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Platform</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f5f7fa;
    }

    .platform-header {
      position: fixed;
      top: 0;
      width: 100%;
      height: 80px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      border-bottom: 1px solid #eee;
      z-index: 1000;
    }

    .platform-hero {
      margin-top: 120px;
      text-align: center;
      padding: 100px 20px;
    }

    .platform-hero h1 {
      font-size: 42px;
    }

    .platform-hero p {
      margin-top: 20px;
      font-size: 18px;
      color: #555;
    }

    .console-btn {
      margin-top: 40px;
      padding: 16px 36px;
      background: #0056ff;
      border-radius: 10px;
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header class="platform-header">
  <div style="font-weight:700;">KRYPHEX</div>
  <div id="userArea"></div>
</header>

<section class="platform-hero">
  <h1>Welcome to Kryphex Platform</h1>
  <p>Manage consultations, track requests, and access enterprise tools.</p>

  <button class="console-btn" onclick="location.href='console.html'">
    Open Console
  </button>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://xvtnnszvfbirixppbdtl.supabase.co",
  "sb_publishable_pQJ3E0t7j34sImItSqxn6Q_jLBGuasq"
);

async function loadUser() {
  const { data } = await supabaseClient.auth.getUser();
  const userArea = document.getElementById("userArea");

  if (!data.user) {
    window.location.href = "auth/login.html";
    return;
  }

  userArea.innerHTML = `
    <span style="margin-right:20px;font-weight:600;">
      ${data.user.email}
    </span>
    <a href="#" onclick="logout()" style="text-decoration:none;font-weight:600;">
      Logout
    </a>
  `;
}

async function logout() {
  await supabaseClient.auth.signOut();
  window.location.href = "index.html";
}

loadUser();
</script>

</body>
</html>
