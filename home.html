<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Platform</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2563eb;
      --dark: #0f172a;
      --muted: #64748b;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      color: var(--dark);
    }

    .header {
      position: fixed;
      top: 0;
      width: 100%;
      height: 80px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 60px;
      border-bottom: 1px solid #eee;
      z-index: 1000;
    }

    .dashboard {
      margin-top: 120px;
      padding: 60px;
    }

    .dashboard h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
      gap: 30px;
      margin-top: 40px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      transition: 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
    }

    .card h3 {
      margin: 0 0 10px;
    }

    .card p {
      color: var(--muted);
    }

  </style>
</head>

<body>

<header class="header">
  <div style="font-weight:700;">KRYPHEX</div>
  <div id="userArea"></div>
</header>

<div class="dashboard">
  <h1>Platform Overview</h1>
  <p style="color:#64748b;">Manage enterprise consultations and security operations.</p>

  <div class="cards">
    <div class="card">
      <h3>Security Console</h3>
      <p>Access monitoring and threat intelligence tools.</p>
      <br>
      <a href="console.html">Open →</a>
    </div>

    <div class="card">
      <h3>Consultations</h3>
      <p>Track and manage your submitted requests.</p>
      <br>
      <a href="tools/my-consultations.html">View →</a>
    </div>

    <div class="card">
      <h3>Request New</h3>
      <p>Schedule a new enterprise consultation.</p>
      <br>
      <a href="consultation.html">Schedule →</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://xvtnnszvfbirixppbdtl.supabase.co",
  "sb_publishable_pQJ3E0t7j34sImItSqxn6Q_jLBGuasq"
);

async function loadUser() {
  const { data } = await supabaseClient.auth.getUser();

  if (!data.user) {
    window.location.href = "auth/login.html";
    return;
  }

  document.getElementById("userArea").innerHTML = `
    <span style="margin-right:20px;font-weight:600;">
      ${data.user.email}
    </span>
    <a href="#" onclick="logout()">Logout</a>
  `;
}

async function logout() {
  await supabaseClient.auth.signOut();
  window.location.href = "index.html";
}

loadUser();
</script>

</body>
</html>
