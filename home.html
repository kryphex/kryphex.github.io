<!DOCTYPE html>
<html>
<head>
  <title>Kryphex | Platform</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body class="platform-body">

<!-- HEADER -->

<header class="platform-header">

  <div class="hamburger" onclick="toggleMenu(this)">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="center-logo">
    <a href="home.html">
      <img src="logo.svg" alt="Kryphex Logo">
    </a>
  </div>

  <div class="user-area">
    <span id="userEmail"></span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

</header>

<!-- MOBILE MENU -->

<nav id="mobileMenu" class="mobile-menu">
  <a href="tools/console.html">Console</a>
  <a href="consultation.html">Consultation</a>
  <a href="tools/">Security Tools</a>
  <a href="insights.html">Insights</a>
</nav>

<!-- HERO / DASHBOARD PREVIEW -->

<section class="platform-hero">

  <h1>Welcome to Kryphex Platform</h1>

  <p>
    Your centralized enterprise security environment.
    Monitor, assess, and control infrastructure risk.
  </p>

  <div class="platform-buttons">
    <button class="btn" onclick="location.href='tools/console.html'">
      Open Security Console
    </button>

    <button class="btn-outline" onclick="location.href='consultation.html'">
      Request Assessment
    </button>
  </div>

</section>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = supabase.createClient(
  "https://xvtnnszvfbirixppbdtl.supabase.co",
  "sb_publishable_pQJ3E0t7j34sImItSqxn6Q_jLBGuasq"
);

// Protect page
async function checkAuth() {
  const { data } = await supabaseClient.auth.getUser();

  if (!data.user) {
    window.location.href = "auth/login.html";
  } else {
    document.getElementById("userEmail").innerText = data.user.email;
  }
}

checkAuth();

async function logout() {
  await supabaseClient.auth.signOut();
  window.location.href = "index.html";
}

function toggleMenu(el) {
  el.classList.toggle("active");
  document.getElementById("mobileMenu").classList.toggle("open");
}
</script>

</body>
</html>
